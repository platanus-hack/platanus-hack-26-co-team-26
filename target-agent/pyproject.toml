[project]
name = "target-agent"
version = "0.1.0"
description = "Acme support agent — blanco de prueba deliberadamente vulnerable (D1/D3)."
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
