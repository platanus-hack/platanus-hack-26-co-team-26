name: backend-ci

on:
  pull_request:
    paths: ["services/**"]

jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e services/shared[dev] || pip install -e services/shared
      # alert_ingestor y found_persons son hexágonos propios con sus propias
      # dependencias (services/shared no instala hoy: gtsam pineado a numpy<2 choca
      # con el numpy>=2.1 del kernel — ver su README). Sin instalarlos, lint-imports
      # no resuelve sus módulos y los contratos fallarían por "módulo inexistente",
      # no por una violación real.
      - run: pip install -e "services/alert_ingestor[dev]"
      - run: pip install -e "services/found_persons[dev]"
      - run: ruff check services/
      - run: lint-imports # .importlinter
      - run: pytest services/
