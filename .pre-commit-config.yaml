repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.3
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^services/

  - repo: local
    hooks:
      - id: no-clinical-vocab
        name: "vocabulario clínico prohibido (docs/glossary.md)"
        entry: bash -c '! grep -rEn "triage|diagn[oó]stico|signos vitales|oximetr[ií]a" --include="*.kt" --include="*.py" --include="*.tsx" --include="*.ts" core android services web 2>/dev/null | grep -v "NUNCA\|nunca\|prohibid\|# noqa"'
        language: system
        pass_filenames: false
