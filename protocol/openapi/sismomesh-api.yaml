openapi: 3.0.3
info:
  title: SismoMesh Cloud API
  version: 0.1.0
  description: >
    Resumen normativo — contrato completo en protocol/openapi/. Backend Python+FastAPI
    (Sección 12). Todo endpoint que devuelva PII escribe en audit_log ANTES de responder.
servers:
  - url: https://api.sismomesh.example/v1
paths:
  /v1/gateway/sync:
    post:
      summary: Subida masiva de bundles (protobuf), sin PII agregada
      operationId: gatewaySync
      responses:
        "200":
          description: OK
  /v1/incidents/{id}/public:
    get:
      summary: Agregados públicos (conteos, zonas) — cero PII
      operationId: getIncidentPublic
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: OK
  /v1/incidents/{id}/nodes:
    get:
      summary: Requiere rol respondiente
      operationId: getIncidentNodes
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmergencyDevice"
  /v1/nodes/{id}/estimate:
    get:
      summary: Zona candidata + confianza
      operationId: getNodeEstimate
      responses:
        "200":
          description: OK
  /v1/incidents/{id}/heatmap:
    get:
      summary: GeoJSON / teselas de verosimilitud
      operationId: getIncidentHeatmap
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: OK
  /v1/family/link:
    post:
      summary: Vinculación consentida
      operationId: linkFamily
      responses:
        "200":
          description: OK
  /v1/family/status:
    get:
      summary: Estado autorizado por consentimiento
      operationId: getFamilyStatus
      responses:
        "200":
          description: OK
  /v1/alerts/manual:
    post:
      summary: Activación manual (rol autoridad)
      operationId: postManualAlert
      responses:
        "200":
          description: OK
components:
  schemas:
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        altitudeMeters: { type: number, format: double, nullable: true }
    LocationEvidenceType:
      type: string
      enum: [CURRENT_GPS, LAST_KNOWN, HISTORICAL_ESTIMATE, MANUAL, RELAY_OBSERVATION]
    FreshnessState:
      type: string
      enum: [LIVE, RECENT, AGING, STALE]
    MotionState:
      type: string
      enum: [UNKNOWN, STATIONARY, MOVING, RAPID_MOVEMENT]
    EmergencyLocationSnapshot:
      type: object
      required: [deviceId, evidenceType, recentMovementDetected, sourceDeviceTimestamp]
      properties:
        deviceId: { type: string }
        point: { $ref: "#/components/schemas/GeoPoint" }
        accuracyMeters: { type: number, minimum: 0, nullable: true }
        evidenceType: { $ref: "#/components/schemas/LocationEvidenceType" }
        locationTimestamp: { type: string, format: date-time, nullable: true }
        recentMovementDetected: { type: boolean, description: Device evidence only; never proof of life. }
        lastMovementTimestamp: { type: string, format: date-time, nullable: true }
        motionConfidence: { type: number, minimum: 0, maximum: 1, nullable: true }
        batteryPercent: { type: integer, minimum: 0, maximum: 100, nullable: true }
        sourceDeviceTimestamp: { type: string, format: date-time }
    EmergencyDevice:
      allOf:
        - $ref: "#/components/schemas/EmergencyLocationSnapshot"
        - type: object
          required: [freshness, networkSource, relayHops]
          properties:
            freshness: { $ref: "#/components/schemas/FreshnessState" }
            networkSource: { type: string, enum: [INTERNET, BLE_RELAY, WIFI_AWARE] }
            relayHops: { type: integer, minimum: 0 }
  parameters:
    IncidentId:
      name: id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

# Wire-efficient mesh payloads remain protobuf; these JSON schemas define API projections.
