syntax = "proto3";

package helius.v1;

option java_package = "co.helius.core.protocol.v1";
option java_multiple_files = true;

// Análisis e Interpretación de Biomarcadores (AIB) — Sección 11. Dueño: Alex/Laura.
// Naming obligatorio: NUNCA "vitals", "triage", "diagnóstico", "signos vitales médicos".
// Todo resultado es evidencia con incertidumbre — ver docs/glossary.md.
message BiomarkerEvidence {
  optional double pulse_bpm = 1;
  double pulse_ci_low = 2;   // intervalo de confianza
  double pulse_ci_high = 3;
  double sqi = 4;            // Signal Quality Index [0,1]
  string source = 5;         // "camera_ppg" | "certified_device"
  string model_version = 6;
  uint64 observed_at = 7;
  uint32 window_ms = 8;
}
