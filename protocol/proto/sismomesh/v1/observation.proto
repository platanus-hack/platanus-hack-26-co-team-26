syntax = "proto3";

package sismomesh.v1;

option java_package = "co.sismomesh.core.protocol.v1";
option java_multiple_files = true;

import "sismomesh/v1/status.proto";

// PeerObservation: lo que un nodo registra al ver a otro (RSSI, transporte, timestamp) —
// alimenta la localización probabilística (Sección 9). Dueño: Helmut (captura) / Miguel (backend).
message PeerObservation {
  bytes incident_id = 1;
  bytes node_a = 2;
  bytes node_b = 3;
  double rssi_dbm = 4;
  string transport = 5;
  optional GeoPoint observer_geo = 6;
  optional double observer_acc_m = 7;
  uint64 observed_at = 8;
}
