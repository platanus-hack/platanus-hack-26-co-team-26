syntax = "proto3";

package sismomesh.v1;

option java_package = "co.sismomesh.core.protocol.v1";
option java_multiple_files = true;

// Tipos base compartidos por el resto del protocolo. Aislados aquí para
// romper el ciclo bundle.proto <-> status.proto (ambos necesitaban estos
// tipos). Ningún otro .proto debe importar bundle.proto.

enum Priority {
  P0_LIFE_CRITICAL = 0;
  P1_LOCATION = 1;
  P2_STATUS = 2;
  P3_NETWORK_OBS = 3;
  P4_RAW_SENSOR = 4;
  P5_DIAGNOSTIC = 5;
}

enum ResponseState {
  UNKNOWN = 0;
  SAFE = 1;
  NEEDS_HELP = 2;
  TRAPPED = 3;
  UNCONFIRMED = 4;
  NO_RECENT_EVIDENCE = 5;
  // Prohibido agregar DEAD/ALIVE/INJURED — ver Sección 1.3 y docs/glossary.md.
}

enum AltitudeSource {
  ALTITUDE_UNKNOWN = 0;
  GNSS = 1;             // ruidoso en interiores/escombros, referencia débil
  BAROMETRIC = 2;        // diferencial de presión, requiere calibración por edificio
  UWB_ELEVATION = 3;     // ranging de corto alcance, mejor precisión relativa
  FUSED = 4;             // factor graph combinando las anteriores
}

// Ver ADR-0009 (localización 3D) para el origen de altitude_m/acc.
message GeoPoint {
  double lat = 1;
  double lon = 2;
  optional double acc_m = 3;
  optional double altitude_m = 4;      // relativa al nivel del suelo del edificio si se conoce, si no MSL/GNSS
  optional double altitude_acc_m = 5;  // ASSUMED hasta calibración — ver docs/validation/VALIDATION.md
  optional AltitudeSource altitude_source = 6;
}
