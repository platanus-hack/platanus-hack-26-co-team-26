syntax = "proto3";

package sismomesh.v1;

option java_package = "co.sismomesh.core.protocol.v1";
option java_multiple_files = true;

import "sismomesh/v1/bundle.proto";

message GeoPoint {
  double lat = 1;
  double lon = 2;
  optional double acc_m = 3;
}

message EmergencyStatus {
  optional GeoPoint location = 1;
  uint64 ts = 2;
  string source = 3;
  ResponseState response_state = 4;
  uint32 battery = 5; // 0-100
  string device_state = 6;
  repeated string evidence_refs = 7;
}
