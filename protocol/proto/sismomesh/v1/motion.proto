syntax = "proto3";

package sismomesh.v1;

option java_package = "co.sismomesh.core.protocol.v1";
option java_multiple_files = true;

// Evidencia de actividad/movimiento — Sección 10. Dueño: Alex.
// Prohibido: DEAD/ALIVE/INJURED. Estados permitidos en el enum de arriba (bundle.proto).
message MotionEvidence {
  double purposeful_motion_confidence = 1; // [0,1]
  string pattern = 2;    // p.ej. "3-3" (tipo SOS), vacío si no hay patrón
  uint64 last_motion_ts = 3;
  string activity_state = 4; // RESPONSIVE | RECENT_INTERACTION | PURPOSEFUL_MOTION |
                              // MOTION_DETECTED | PULSE_SIGNAL_DETECTED | NO_RECENT_EVIDENCE | UNKNOWN
}
