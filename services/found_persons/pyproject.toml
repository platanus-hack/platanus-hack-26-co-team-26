[project]
name = "helius-found-persons"
version = "0.1.0"
description = "API de personas localizadas bajo el régimen colombiano de habeas data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "cryptography>=43", # Ed25519, X25519, ChaCha20-Poly1305 (ver adapters/crypto)
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8", "import-linter>=2.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# `RUF012` y `A003` chocan con nombres del dominio legal; el resto se respeta.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
