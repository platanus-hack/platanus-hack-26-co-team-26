[project]
name = "sismomesh-alert-ingestor"
version = "0.1.0"
description = "Ingesta de alertas sísmicas (EMSC/USGS/SGC), dedupe y decisión de activación"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",     # USGS (y en el futuro SGC): feed HTTP/GeoJSON
    "websockets>=13",  # EMSC: standing order en tiempo real
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
