services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: helius
      POSTGRES_USER: helius
      POSTGRES_PASSWORD: helius_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: helius
      MINIO_ROOT_PASSWORD: helius_dev
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  api:
    build:
      context: ./services/shared
    depends_on: [postgres, redis, minio]
    environment:
      DATABASE_URL: postgresql://helius:helius_dev@postgres:5432/helius
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    command: uvicorn src.api.bootstrap.main:app --host 0.0.0.0 --port 8000 --reload

  alert_ingestor:
    build:
      context: ./services/alert_ingestor
    environment:
      ALERT_INGESTOR_POLL_INTERVAL_S: "15"
    restart: unless-stopped

  # Observabilidad (OpenTelemetry → Grafana / Loki / Tempo), Sección 2.1.
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports: ["16686:16686"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]

volumes:
  pgdata:
  miniodata:

# Dueño: Miguel (backend) + Helmut (transporte/DTN) (observabilidad de transporte/DTN).
